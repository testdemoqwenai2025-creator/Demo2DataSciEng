# ============================================================
# Deploy the static export to GitHub Pages on every push to main.
# Builds the Next.js app with GITHUB_PAGES=true (static export +
# basePath=/DemoAppDataSci), then publishes to the gh-pages branch.
# GitHub Pages serves from gh-pages at the project URL:
#   https://testdemoqwenai2025-creator.github.io/DemoAppDataSci/
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Sync workflow pushes here; we still deploy on those pushes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# Allow only one concurrent deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
        run: bun run build:static

      - name: Add .nojekyll (bypass Jekyll for _next folder)
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
