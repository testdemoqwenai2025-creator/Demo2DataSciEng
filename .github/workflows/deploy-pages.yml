# ============================================================
# Deploy the static export to GitHub Pages on every push to main.
# Builds the Next.js app with GITHUB_PAGES=true (static export +
# basePath=/Demo2DataSciEng), then publishes to the gh-pages branch.
# GitHub Pages serves from gh-pages at the project URL:
#   https://testdemoqwenai2025-creator.github.io/Demo2DataSciEng/
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Sync workflow pushes here; we still deploy on those pushes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# Allow only one concurrent deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Exclude API routes from static build
        # Next.js `output: export` does NOT support API routes.
        # Move src/app/api/ out of the build path so the static export succeeds.
        # The dashboard's fetch to /api/agent-triage will 404 on the static site
        # — its error handling falls back to a deterministic stub gracefully.
        # In dev mode (where GITHUB_PAGES is not set), the route is restored
        # by the developer's local checkout.
        run: |
          mkdir -p .api-routes-backup
          if [ -d src/app/api ]; then
            mv src/app/api .api-routes-backup/api
            echo "Moved src/app/api out of build path"
          fi

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
        run: bun run build:static

      - name: Restore API routes (so they remain in the repo)
        if: always()
        run: |
          if [ -d .api-routes-backup/api ] && [ ! -d src/app/api ]; then
            mkdir -p src/app
            mv .api-routes-backup/api src/app/api
            echo "Restored src/app/api"
          fi
          rm -rf .api-routes-backup

      - name: Add .nojekyll (bypass Jekyll for _next folder)
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ============================================================
# AUDIT: After deploy, verify all pages render correctly.
# If any page fails, the workflow reports a warning (but doesn't
# block the deploy — the pages are already live).
# ============================================================
  audit:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run page audit
        run: |
          python3 scripts/audit_all_pages_live.py || echo "::warning::Some pages may have issues."
