# ============================================================
# Sync workflow: AppDataSci-Advanced (private) → DemoAppDataSci (public)
# On every push to main, mirror the commit to the public preview repo.
# ============================================================
name: Mirror to public preview repo

on:
  push:
    branches:
      - main
    # ignore workflow-only commits to avoid loops
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Only run on the private source-of-truth repo — the synced public copy has
    # the workflow file too, but SYNC_TO_PUBLIC_PAT secret only exists on private
    if: ${{ github.repository == 'testdemoqwenai2025-creator/AppDataSci-Advanced' }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push mirror to public repo
        env:
          GH_PAT: ${{ secrets.SYNC_TO_PUBLIC_PAT }}
        run: |
          # Mirror is one-way: private → public, always overwrite main on public.
          # Plain --force is intentional here because the public repo is a pure
          # preview mirror; only this workflow is allowed to push to it (enforced
          # via branch protection on the public repo).
          git remote add public "https://x-access-token:${GH_PAT}@github.com/testdemoqwenai2025-creator/DemoAppDataSci.git"
          # Fetch public's current main so we can detect divergent history
          git fetch public main || true
          # Push main → main, force-overwriting public main with the latest private commit
          git push --force public refs/heads/main:refs/heads/main
          # Mirror tags too
          git push --tags --force public || true

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Mirror sync failed — review the workflow run and re-trigger manually."
